  <head>

    <meta id="mobile-theme-color" name="theme-color" content="#070914" media="(max-width: 760px), (max-height: 500px)" />

    <meta
      property="og:description"
      content="Unity gameplay systems, shipped cross-platform titles, and editor tooling."
    />
    <meta property="og:type" content="website" />
    <!--
      Only the landing route owns the 3D camp. Create its preload hints here,
      before the app module, but do not make a direct /projects/* visit download
      megabytes of camp assets it will never display. Every hinted URL matches
      the eventual loader request exactly, including CORS mode and cache-buster.
    -->
    <script>
      if (location.pathname === '/' || location.pathname === '/index.html') {
        const hints = [
          ['/models/tent-painted-blue-final.glb?v=4', 'fetch'],
          ['/models/campsite-kit.glb?v=2', 'fetch'],
          ['/models/bench-setups.glb', 'fetch'],
          ['/draco/draco_wasm_wrapper.js', 'fetch'],
          ['/draco/draco_decoder.wasm', 'fetch', 'application/wasm'],
          ['/textures/tent-cloth/fabric030-neutral/Fabric030_Packed.webp', 'image'],
          ['/textures/T_Dirt_Ground_C.webp', 'image'],
          ['/textures/T_Dirt_Ground_N.webp', 'image'],
          ['/fonts/archivo-latin-var.woff2', 'font', 'font/woff2'],
          ['/fonts/archivo-black-latin.woff2', 'font', 'font/woff2'],
          ['/fonts/eb-garamond-latin-var.woff2', 'font', 'font/woff2'],
          ['/fonts/eb-garamond-italic-latin-var.woff2', 'font', 'font/woff2'],
          ['/fonts/jetbrains-mono-latin-var.woff2', 'font', 'font/woff2'],
        ]
        for (const [href, as, type] of hints) {
          const link = document.createElement('link')
          link.rel = 'preload'
          link.href = href
          link.as = as
          link.crossOrigin = 'anonymous'
          if (type) link.type = type
          document.head.append(link)
        }
      }
    </script>
  </head>
  <body>
    <script>
      const redirect = sessionStorage.getItem('spa-redirect')
      if (redirect) {
        sessionStorage.removeItem('spa-redirect')
        const target = new URL(redirect)
        history.replaceState(null, '', target.pathname + target.search + target.hash)
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
